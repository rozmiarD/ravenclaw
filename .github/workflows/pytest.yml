name: pytest

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
        slice:
          - contracts_policy
          - auto_campaign
          - runtime_core
          - runtime_runner
          - logdash
          - misc_public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ravenclaw test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sclite-core @ git+https://github.com/rozmiarD/SCLite.git@main"
          python -m pip install "govengine @ git+https://github.com/rozmiarD/GovEngine.git@main"
          python -m pip install -e '.[dev]'
      - name: Validate public truth
        run: python scripts/validate_public_truth.py
      - name: Run pytest slice
        env:
          RAVENCLAW_WORKSPACE: ${{ github.workspace }}
          RAVENCLAW_REPORTS_DIR: ${{ runner.temp }}/ravenclaw-reports
          RAVENCLAW_TMP_DIR: ${{ runner.temp }}/ravenclaw-tmp
          RAVENCLAW_LOGDASH_DB: ${{ runner.temp }}/ravenclaw-logdash/logs.db
          RAVENCLAW_PIPELINE_CONFIG: ${{ runner.temp }}/ravenclaw-pipeline.json
          RAVENCLAW_CONTEXT_SUMMARY_PATH: ${{ runner.temp }}/ravenclaw-reports/cache/context_summary.json
        run: python scripts/run_pytest_slice.py ${{ matrix.slice }}

  public-helper-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Ravenclaw public helper dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sclite-core @ git+https://github.com/rozmiarD/SCLite.git@main"
          python -m pip install "govengine @ git+https://github.com/rozmiarD/GovEngine.git@main"
          python -m pip install -e '.[dev]'
      - name: Validate public truth and boundaries
        run: |
          python scripts/validate_public_truth.py
          python scripts/validate_extraction_roadmap.py
          python scripts/validate_govengine_helper_boundary.py
      - name: Run public helper smoke tests
        env:
          RAVENCLAW_WORKSPACE: ${{ github.workspace }}
          RAVENCLAW_REPORTS_DIR: ${{ runner.temp }}/ravenclaw-reports
          RAVENCLAW_TMP_DIR: ${{ runner.temp }}/ravenclaw-tmp
          RAVENCLAW_LOGDASH_DB: ${{ runner.temp }}/ravenclaw-logdash/logs.db
          RAVENCLAW_PIPELINE_CONFIG: ${{ runner.temp }}/ravenclaw-pipeline.json
          RAVENCLAW_CONTEXT_SUMMARY_PATH: ${{ runner.temp }}/ravenclaw-reports/cache/context_summary.json
        run: |
          python -m pytest -q \
            tests/test_ravenclaw_package.py \
            tests/test_public_truth_validation.py \
            tests/test_extraction_roadmap_validation.py \
            tests/test_govengine_helper_boundary_validation.py \
            engine/tests/test_govengine_security_profile.py

  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install source dependencies and build tooling
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install "sclite-core @ git+https://github.com/rozmiarD/SCLite.git@main"
          python -m pip install "govengine @ git+https://github.com/rozmiarD/GovEngine.git@main"
      - name: Clean build artifacts
        run: rm -rf dist build *.egg-info
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/ravenclaw-wheel-smoke
          /tmp/ravenclaw-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/ravenclaw-wheel-smoke/bin/python -m pip install "sclite-core @ git+https://github.com/rozmiarD/SCLite.git@main"
          /tmp/ravenclaw-wheel-smoke/bin/python -m pip install "govengine @ git+https://github.com/rozmiarD/GovEngine.git@main"
          /tmp/ravenclaw-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/ravenclaw-wheel-smoke/bin/python -m pip check
          /tmp/ravenclaw-wheel-smoke/bin/python -c "import importlib.metadata as md, ravenclaw; assert md.version('ravenclaw-security') == ravenclaw.__version__"
