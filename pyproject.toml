[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravenclaw"
version = "0.10.0"
description = "Governance-first security research runtime"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Krzysztof Probola" }]
dependencies = [
  "PyYAML>=6,<7",
  "sclite-core>=0.2.1,<0.3",
  "govengine>=0.1.5,<0.2",
]

[project.optional-dependencies]
logdash = [
  "Flask>=3,<4",
]
dev = [
  "pytest>=8,<9",
  "Flask>=3,<4",
  "PyYAML>=6,<7",
]

[tool.setuptools]
packages = []
py-modules = []

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["engine/tests", "engine/planer/tests", "tests"]

