version: 1
defaults:
  planner_profile: core
  planner_profiles_env: RAVENCLAW_BRAIN_TOOL_PROFILES
profiles:
  core:
    description: Low-noise web-first offensive baseline for default public-safe campaigns.
    planner_visible: true
    inherits: []
  extended:
    description: Broader offensive tooling for public extended campaigns and deeper
      vector preparation.
    planner_visible: true
    inherits:
    - core
  specialized:
    description: Specialized protocol/platform tooling for advanced offensive workflows.
    planner_visible: true
    inherits:
    - extended
  lab:
    description: High-risk or high-noise tooling for lab/private infrastructure workflows.
    planner_visible: true
    inherits:
    - specialized
  operator_only:
    description: Execution-only/operator intervention tools; never exposed to planner
      prompts.
    planner_visible: false
    inherits: []
capabilities:
  passive_subdomain_discovery:
    description: Passive host/subdomain collection.
  subdomain_permutation:
    description: Candidate generation via permutations.
  dns_resolution:
    description: Resolve candidate names and DNS records.
  dns_enumeration:
    description: General DNS reconnaissance and validation.
  historical_url_collection:
    description: Collect historical or archived URLs.
  crawler_route_discovery:
    description: Discover routes, endpoints, and assets by crawling.
  content_discovery:
    description: Enumerate paths, endpoints, and directories.
  parameter_mining:
    description: Discover parameters and input surface.
  http_probe:
    description: Issue crafted HTTP requests and inspect responses.
  http_fingerprint:
    description: Fingerprint HTTP services and exposed technologies.
  tls_posture_check:
    description: Assess TLS/HTTPS posture and configuration.
  transport_tls_handshake:
    description: Low-level TLS handshake and certificate inspection.
  web_misconfig_check:
    description: Check for common web misconfigurations safely.
  template_detection:
    description: Template/signature-based detection where fit is strong.
  injection_validation:
    description: Validate injection hypotheses with bounded checks.
  service_enumeration:
    description: Enumerate exposed services and banners.
  packet_observation:
    description: Observe traffic/packet behavior.
  secret_exposure_scan:
    description: Scan for exposed secrets or sensitive material.
  auth_bruteforce:
    description: Authentication brute force / password auditing.
  wireless_assessment:
    description: Wireless/RF assessment workflows.
  operator_shell:
    description: Operator/system support tooling, not planner-visible.
task_families:
  recon:
  - passive_subdomain_discovery
  - dns_enumeration
  - http_fingerprint
  - service_enumeration
  subdomain_expansion:
  - passive_subdomain_discovery
  - subdomain_permutation
  - dns_resolution
  historical_url_mining:
  - historical_url_collection
  content_discovery:
  - content_discovery
  - crawler_route_discovery
  tls_assessment:
  - tls_posture_check
  - transport_tls_handshake
  secret_hunt:
  - secret_exposure_scan
  - historical_url_collection
  - crawler_route_discovery
  auth:
  - http_probe
  - parameter_mining
  authz:
  - http_probe
  logic:
  - http_probe
  - parameter_mining
  auth_flow:
  - http_probe
  - parameter_mining
  - packet_observation
  client_input:
  - http_probe
  - parameter_mining
  input_tamper:
  - http_probe
  - parameter_mining
  redirect_trust:
  - http_probe
  - http_fingerprint
  dns:
  - dns_enumeration
  - dns_resolution
  network_service:
  - service_enumeration
  traffic_capture:
  - packet_observation
  wireless:
  - wireless_assessment
tools:
  aircrack-ng:
    enabled: true
    execution_allowed: true
    category: wireless
    planner_profiles: &id001
    - lab
    risk_level: high
    noise_level: high
    requires_auth_approval: false
    supports_chain_role:
    - capture
    - analyze
    capabilities:
    - wireless_assessment
    task_families:
    - wireless
    target_kinds:
    - host
